name: Add reservation list page

on:
  push:
    paths:
      - '.github/workflows/add-reservation-list.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reservation list update
        run: python tools/add_reservation_list.py
      - name: Validate JavaScript
        run: |
          node --check data.js
          node --check app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js style.css index.html
          git commit -m 'Add chronological reservation list page'
          git push
