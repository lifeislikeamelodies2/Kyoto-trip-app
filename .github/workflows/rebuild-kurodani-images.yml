name: Rebuild Kurodani gallery images

on:
  push:
    paths:
      - '.tmp/kurodani-ready'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild balanced AVIF images
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          root = Path('.')
          tmp = root / '.tmp'
          spots = root / 'assets' / 'spots'

          for num in ('02', '03', '04', '05'):
              parts = sorted(tmp.glob(f'kurodani-{num}.part*'))
              if not parts:
                  raise SystemExit(f'Missing parts for kurodani-{num}')
              payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              (spots / f'kurodani-{num}.avif').write_bytes(base64.b64decode(payload))

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'(spot-gallery\.js\?v=)[^"\']+', r'\g<1>20260914-2345', html)
          index.write_text(html, encoding='utf-8')

          for p in tmp.glob('kurodani-*'):
              p.unlink()
          if tmp.exists() and not any(tmp.iterdir()):
              tmp.rmdir()

          workflow = Path('.github/workflows/rebuild-kurodani-images.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit rebuilt images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Kurodani gallery images with balanced high-quality versions'
          git push
