name: Import TOP image

on:
  push:
    paths:
      - '.github/workflows/import-top-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TOP image from Google Drive
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=12933ZngaHB_3cpkFoEHP-9aCB6ZpCe91&export=download&confirm=t' \
            -o assets/top-image.png
          file assets/top-image.png
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/top-image.png')
          sig = p.read_bytes()[:8]
          if sig != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Downloaded file is not a PNG image')
          PY

      - name: Point app to the local image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data.js')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r"const TOP_IMAGE_URL = '.*?';", "const TOP_IMAGE_URL = 'assets/top-image.png';", s, count=1)
          s = re.sub(r"const TOP_IMAGE_FALLBACK_URL = '.*?';", "const TOP_IMAGE_FALLBACK_URL = 'assets/top-image.png';", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit imported image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/top-image.png data.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Store TOP image in repository'
            git push
          fi
