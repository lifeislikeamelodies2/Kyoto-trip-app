name: Update top dashboard

on:
  push:
    paths:
      - '.github/workflows/update-top-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply top page update
        run: python tools/update_top.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js style.css
          git commit -m 'Redesign top page with emergency and next-plan dashboard'
          git push
