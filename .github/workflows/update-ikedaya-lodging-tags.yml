name: Update Ikedaya, lodging, and creative-related tags

on:
  push:
    paths:
      - '.github/workflows/update-ikedaya-lodging-tags.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          data = Path('data.js')
          text = data.read_text(encoding='utf-8')
          m = re.search(r"const FOOD_SPOTS = (\[.*?\]);\s*const SPOTS = (\[.*\]);\s*$", text, re.S)
          if not m:
              raise SystemExit('Could not locate data arrays')

          foods = json.loads(m.group(1))
          spots = json.loads(m.group(2))
          prefix = text[:m.start()]
          prefix = re.sub(r"const UPDATED_AT = '[^']+';", "const UPDATED_AT = '2026-09-10';", prefix, count=1)

          # 「創作」ではなく、実在地に創作設定が紐づくことを示す「創作関連」に統一。
          for s in spots:
              tags = s.get('tags', [])
              s['tags'] = ['創作関連' if t == '創作' else t for t in tags]
              if s.get('category'):
                  s['category'] = s['category'].replace('創作', '創作関連')

          # ヒロイン関連の勢力タグを指定どおり整理。
          for s in spots:
              sid = s.get('id')
              if sid in ('pontocho', 'shimabara'):
                  # 藤雨関連＝長州。場所固有の花街・新選組史タグは残す。
                  tags = [t for t in s.get('tags', []) if t not in ('藤雨','由起緒','麻','佐伯','藤井家')]
                  if '長州' not in tags: tags.insert(0, '長州')
                  if '創作関連' not in tags: tags.append('創作関連')
                  s['tags'] = tags
              elif sid in ('fujii-home', 'saeki-home'):
                  s['tags'] = ['新選組', '長州', '創作関連']
              elif sid in ('asa-former-home', 'asa-home'):
                  s['tags'] = ['土佐', '創作関連']

          # 池田屋事件跡地を「事件地」に追加し、現在の店舗と食事ページへの関連を設定。
          for s in spots:
              if s.get('id') == 'ikedaya':
                  s['category'] = '新選組・長州・事件地'
                  s['tags'] = ['新選組', '長州', '事件地']
                  s['note'] = (
                    '元治元年（1864）の池田屋事件の現場。新選組が長州・土佐など尊攘派の会合を急襲し、隊の名を広く知らしめる転機となった。'
                    '事件は長州藩内の武装上京論を強め、翌月の禁門の変へ向かう緊張を加速させた。現在は往時の建物は残っていないが、跡地には史跡碑があり、'
                    '現在は「個室居酒屋 池田屋 はなの舞 京都三条河原町店」として営業している。店内には池田屋大階段や新選組隊旗など、池田屋事件を題材にした展示・撮影スポットも設けられている。'
                  )
                  s['relatedFoodId'] = 'ikedaya-hananomai'

          # 宿泊先を松葉家旅館から「湯の宿 松栄」へ差し替え。画像は後日追加するため設定しない。
          replacement = {
              'id':'shouei',
              'name':'湯の宿 松栄（ゆのやど しょうえい）',
              'address':'〒600-8826 京都府京都市下京区西新屋敷上之町128（壬生川通正面西入ル）',
              'category':'宿泊',
              'hours':'標準チェックイン 16:00〜／標準チェックアウト 〜10:00 ※宿泊プランごとの設定が優先。',
              'note':'京都・島原エリアにある旅館。京都市内随一と案内される大浴場・露天風呂・サウナを備える。京都駅正面からタクシーで約10分、市バス「七条壬生川」から徒歩約5分。無料駐車場あり。画像は後日追加予定。',
              'source':'https://www.jalan.net/yad311665/',
              'tags':['宿泊'],
              'days':[],
              'checkedAt':'2026-09-10',
              'mapQuery':'湯の宿 松栄 京都市下京区西新屋敷上之町128'
          }
          new_spots = []
          replaced = False
          for s in spots:
              if s.get('id') in ('matsubaya','shouei') or s.get('name') == '松葉家旅館':
                  if not replaced:
                      new_spots.append(replacement)
                      replaced = True
              else:
                  new_spots.append(s)
          if not replaced:
              new_spots.append(replacement)
          spots = new_spots

          data.write_text(
              prefix + 'const FOOD_SPOTS = ' + json.dumps(foods, ensure_ascii=False, separators=(',', ':')) + ';\n' +
              'const SPOTS = ' + json.dumps(spots, ensure_ascii=False, separators=(',', ':')) + ';\n',
              encoding='utf-8'
          )

          # 詳細ページに関連する食事スポットへの導線を追加。
          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("t === '創作'", "t === '創作関連'")
          app = app.replace("tags.includes('創作')", "tags.includes('創作関連')")

          marker = "    const oldMap = spot.oldMap\n"
          if 'const relatedFood = spot.relatedFoodId' not in app:
              insert = "    const relatedFood = spot.relatedFoodId\n      ? `<section class=\"section related-place\"><div class=\"label\">現在の店舗・食事スポット</div><div class=\"related-copy\">この場所では現在「個室居酒屋 池田屋 はなの舞 京都三条河原町店」が営業しています。</div><a class=\"related-link\" href=\"${hrefFor({food:spot.relatedFoodId})}\" data-route=\"food=${encodeURIComponent(spot.relatedFoodId)}\">池田屋 はなの舞の食事ページを見る →</a><a class=\"related-list-link\" href=\"${hrefFor({page:'food'})}\" data-route=\"page=food\">食事スポット一覧を見る</a></section>`\n      : '';\n"
              app = app.replace(marker, insert + marker, 1)
          if '${relatedFood}' not in app:
              app = app.replace('        ${oldMap}\n', '        ${oldMap}\n        ${relatedFood}\n', 1)
          app_path.write_text(app, encoding='utf-8')

          css_path = Path('style.css')
          css = css_path.read_text(encoding='utf-8')
          if '.related-place{' not in css:
              css += '\n.related-place{background:#fffaf1;border:1px solid #eadcc6;border-radius:14px;padding:14px 16px;margin-top:18px}\n.related-copy{font-size:14px;margin-bottom:10px}\n.related-link{display:block;text-decoration:none;font-weight:800;color:var(--accent);padding:11px 12px;border:1px solid var(--accent);border-radius:12px;text-align:center}\n.related-list-link{display:inline-block;margin-top:10px;color:var(--muted);font-size:12px;text-decoration:none}\n'
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check data.js
          node --check app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js app.js style.css
          git commit -m 'Update Ikedaya event link, lodging, and creative-related tags'
          git push
