name: Import old maps and Matsubaya photo

on:
  push:
    paths:
      - '.github/workflows/import-oldmaps-and-matsubaya.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/oldmaps assets/spots

          download() {
            local id="$1"
            local out="$2"
            echo "Downloading $out"
            curl -L --fail --retry 3 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "$out"
            file "$out"
          }

          # 旅館写真
          download '1M-h-HdLNVylobAdko4vXS2ClXQotlkb7' 'assets/spots/matsubaya.jpg'

          # 幕末期周辺図（元サイトと同じ16地点）
          download '1dRCtfJllOjJhHIsQLbMeSc5FjbqvFvrN' 'assets/oldmaps/ryozen.png'
          download '1Aw9LXamLOgGCl2sD1GfxCM8zehIV8CLy' 'assets/oldmaps/mibu.png'
          download '11qMKpS2soID5RWfP533i2CtKmnmnlzQi' 'assets/oldmaps/nishi.png'
          download '1SvV3cdJokcbK8jhgFN7Td2K9obbVPQ85' 'assets/oldmaps/kitano.png'
          download '1gi0L4r07P0QX-d1k4W6oIEgK6ypY6Cn1' 'assets/oldmaps/higashi.png'
          download '10EEB9q-sZOTb_WrErlx4qyWfcVdtq-gV' 'assets/oldmaps/ikedaya.png'
          download '1ce38tpiopZjT9vsli33SWUYod5w8YB4z' 'assets/oldmaps/kurodani.png'
          download '1Ad0-hfwQB0FLg5vQcMidi3sGTv--29uV' 'assets/oldmaps/hamaguri.png'
          download '1IYk3W4YX0Cczo0UxRo6OFspW_coY7e3J' 'assets/oldmaps/choshu.png'
          download '1Z-c6S8hRc2CU1GQFXJ97ALhnFBEOP4wO' 'assets/oldmaps/katsura.png'
          download '18YT7ixaD7Yl7THirF9YR7l3IHWu7zYma' 'assets/oldmaps/takatsukasa.png'
          download '1TDnmzo8zJrajOBcBEutU4QFLJPWI8HQ5' 'assets/oldmaps/suzaku.png'
          download '1gIYUwDLtDJrP-VNzpSlaG60OhwRG2vuH' 'assets/oldmaps/pontocho.png'
          download '1sXPeOOVJVTZL2Y6hfu2RLB-5ff8KGDrL' 'assets/oldmaps/shimabara.png'
          download '19RI8iE7n38bl9NdllHpa-oqYhLy03VMt' 'assets/oldmaps/fujii-home.png'
          download '1-G3ROghhmCgtEkT2KAVavlvPNgtuzu8A' 'assets/oldmaps/saeki-home.png'

      - name: Commit imported binary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/oldmaps assets/spots/matsubaya.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Store old maps and Matsubaya photo in repository'
            git push
          fi
