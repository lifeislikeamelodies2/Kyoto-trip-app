name: Upgrade Kurodani gallery images

on:
  push:
    paths:
      - 'upload_parts/READY'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild balanced-quality gallery images
        shell: bash
        run: |
          set -euo pipefail
          cat upload_parts/test-small.txt | tr -d '\n\r ' | base64 -d > assets/spots/kurodani-02.avif
          for id in 03 04 05; do
            cat upload_parts/kurodani-${id}.part* | tr -d '\n\r ' | base64 -d > assets/spots/kurodani-${id}.avif
          done
          python - <<'PY'
          from pathlib import Path
          import re

          gallery = Path('spot-gallery.js')
          text = gallery.read_text(encoding='utf-8')
          version = '20260914-1618-hq'
          for image_id in ('02', '03', '04', '05'):
              pattern = rf"assets/spots/kurodani-{image_id}\.avif(?:\?v=[^']*)?"
              text = re.sub(pattern, f"assets/spots/kurodani-{image_id}.avif?v={version}", text)
          gallery.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'(spot-gallery\.js\?v=)[^"\']+', r'\g<1>20260914-1618', html)
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit upgraded images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/spots/kurodani-02.avif assets/spots/kurodani-03.avif assets/spots/kurodani-04.avif assets/spots/kurodani-05.avif spot-gallery.js index.html
          git commit -m 'Upgrade Kurodani gallery image quality'
          git push
