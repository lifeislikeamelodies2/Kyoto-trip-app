name: Rebuild Kurodani gallery images

on:
  push:
    paths:
      - '.tmp/kurodani-ready'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild balanced WebP images and update gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          root = Path('.')
          tmp = root / '.tmp'
          spots = root / 'assets' / 'spots'

          for num in ('02', '03', '04', '05'):
              parts = sorted(tmp.glob(f'kurodani-{num}.part*'))
              if not parts:
                  raise SystemExit(f'Missing parts for kurodani-{num}')
              payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              (spots / f'kurodani-{num}.webp').write_bytes(base64.b64decode(payload))

          gallery = Path('spot-gallery.js')
          text = gallery.read_text(encoding='utf-8')
          text = text.replace("assets/spots/kurodani-02.avif", "assets/spots/kurodani-02.webp")
          text = text.replace("assets/spots/kurodani-03.avif", "assets/spots/kurodani-03.webp")
          text = text.replace("assets/spots/kurodani-04.avif", "assets/spots/kurodani-04.webp")
          text = text.replace("assets/spots/kurodani-05.avif", "assets/spots/kurodani-05.webp")
          gallery.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'(spot-gallery\.js\?v=)[^"\']+', r'\g<1>20260914-2345', html)
          index.write_text(html, encoding='utf-8')

          for num in ('02', '03', '04', '05'):
              old = spots / f'kurodani-{num}.avif'
              if old.exists():
                  old.unlink()

          for p in tmp.glob('kurodani-*'):
              p.unlink()
          if tmp.exists() and not any(tmp.iterdir()):
              tmp.rmdir()
          PY

      - name: Commit rebuilt images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Kurodani gallery images with balanced WebP versions'
          git push
