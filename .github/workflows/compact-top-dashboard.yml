name: Compact top dashboard

on:
  push:
    paths:
      - '.github/workflows/compact-top-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact top dashboard
        run: python tools/compact_top_update.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js style.css
          git commit -m 'Compact top page dashboard into two-column layout'
          git push
