name: Add new spots and food pages

on:
  push:
    paths:
      - '.github/workflows/add-spots-and-food.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply updates
        run: python tools/update_app.py
      - name: Validate JavaScript
        run: |
          node --check data.js
          node --check app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js app.js style.css
          git commit -m 'Add Tosa and creative spots plus food pages'
          git push
